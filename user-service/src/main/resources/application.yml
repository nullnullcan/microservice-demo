spring:
  application:
    name: user-service

# 多 profile 配置
---
spring:
  config:
    activate:
      on-profile: cloud,dubbo
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
server:
  port: 8081

# Dubbo 专用配置（仅在 dubbo profile 下生效）
dubbo:
  application:
    name: user-service
  protocol:
    name: dubbo
    port: -1          # 自动分配端口
  registry:
    address: nacos://127.0.0.1:8848
  scan:
    base-packages: com.demo.service.impl